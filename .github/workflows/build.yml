name: Build Switch NRO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler le NRO
        run: make
      - name: Sauvegarder le NRO
        uses: actions/upload-artifact@v4
        with:
          name: jeu-switch
          path: "*.nro"
          
