name: Build Switch Homebrew
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # On force une version récente de l'image qui contient libnx >= 4.10.0
    container: devkitpro/devkita64:20250315 
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile
        run: make
        
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: mioz-zombie-world
          path: "*.nro"
